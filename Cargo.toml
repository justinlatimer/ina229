[package]
name = "ina229"
version = "0.1.0"
edition = "2021"
authors = [
    "Justin Latimer <justinlatimer@gmail.com>",
]
description = "Driver for INA229 SPI voltage/current/power monitor"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/justinlatimer/ina229"

[dependencies]
bitflags = "2"
byteorder = { version = "1", default-features = false }
embedded-hal = "1.0"

[dev-dependencies]
approx = "0.5"
embedded-hal-mock = { version = "0.11", default-features = false, features = ["eh1"] }
