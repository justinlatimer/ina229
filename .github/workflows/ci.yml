name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv6m-none-eabi

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test without default features
        run: cargo test --no-default-features

      - name: Test all features
        run: cargo test --all-features

      - name: Lint without default features
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Lint all features
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check documentation without default features
        run: cargo doc --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check documentation for all features
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check embedded target without default features
        run: cargo check --lib --target thumbv6m-none-eabi --no-default-features

      - name: Check embedded target with all features
        run: cargo check --lib --target thumbv6m-none-eabi --all-features
